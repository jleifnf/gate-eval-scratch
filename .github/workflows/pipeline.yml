        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: web
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: scripts
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"
  security-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: security-scans
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"

  plan-validation:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: plan-validation
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
