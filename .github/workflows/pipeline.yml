name: Pipeline

# Scratch platform-behavior experiment (TASK-212 PR 4). SYNTHETIC: no real checks run. The
# triggers, concurrency group and the `required-gate` job mirror Limenry's pipeline.yml. Each
# synthetic job reads the LIVE PR body and behaves per a `job.<name>=ok|fail|slow:<seconds>` line.

on:
  pull_request:
    branches: [trunk]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true  # the no-cancel variant is a workflow edit on a branch

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr-baseline: "true"
      data-migration: "false"
      security-supply-chain: "false"
      backend-contract: "false"
      frontend-quality: "false"
      ai-agent-behavior: "false"
      staging-promotion: "false"
      production-release: "false"
      docs-only: "true"
    steps:
      - run: echo "evidence job=changes run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} action=${{ github.event.action }}" | tee -a "$GITHUB_STEP_SUMMARY"
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: context
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Behave as the PR body says (live read)
