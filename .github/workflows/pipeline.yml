            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"

  pr-baseline:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      dependency-scan-agent: ${{ steps.kids.outputs.dependency-scan-agent }}
      dependency-scan-db: ${{ steps.kids.outputs.dependency-scan-db }}
      dependency-scan-scripts: ${{ steps.kids.outputs.dependency-scan-scripts }}
      dependency-scan-web: ${{ steps.kids.outputs.dependency-scan-web }}
      sbom: ${{ steps.kids.outputs.sbom }}
      exceptions: ${{ steps.kids.outputs.exceptions }}
    steps:
      - id: behave
        name: Behave as the PR body says (live read)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB: pr-baseline
        run: |
          set -euo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          mode=$(printf '%s\n' "$body" | sed -n "s/^job\.${JOB}=//p" | head -1)
          mode=${mode:-ok}
          {
            echo "evidence job=${JOB} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} mode=${mode} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            ok) ;;
            fail) echo "evidence finished=$(date -u +%FT%TZ) result=failure"; echo "mode=fail" >> "$RUNNER_TEMP/mode"; exit 1 ;;
            slow:*) sleep "${mode#slow:}" ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          echo "evidence finished=$(date -u +%FT%TZ) result=success" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: kids
        if: always()
        run: |
          r=success
          if [ "${{ steps.behave.outcome }}" != "success" ]; then r=failure; fi
          for c in dependency-scan-agent dependency-scan-db dependency-scan-scripts dependency-scan-web sbom exceptions; do
            echo "$c=$r" >> "$GITHUB_OUTPUT"
          done

  required-gate:
    needs: [changes, context, api, db, web, scripts, security-scans, plan-validation, pr-baseline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Aggregate the gate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          body=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""')
          digest=$(printf '%s' "$body" | shasum -a 256 | cut -c1-16)
          {
            echo "evidence job=required-gate run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} action=${{ github.event.action }}"
            echo "evidence head_sha=${{ github.event.pull_request.head.sha }} tested_sha=${GITHUB_SHA} body_sha256_at_end=${digest}"
            echo "evidence started=$(date -u +%FT%TZ)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_required_gate.py
          rc=$?
          echo "evidence finished=$(date -u +%FT%TZ) gate_exit=${rc}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
